<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>Medidor de Bocha</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--mut:#6b6b66;--ac:#1f7a4d;--acfg:#fff;--bd:#d9d7cf;--bad:#c0392b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--fg:#ecebe6;--card:#222421;--mut:#9a9a93;--ac:#3fae77;--acfg:#0b1a12;--bd:#3a3c38;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
button,.btn{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:12px;font:inherit;text-align:center;cursor:pointer;display:block}
.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
canvas{width:100%;height:auto;border-radius:10px;touch-action:none;background:#000;display:block}
.mut{color:var(--mut);font-size:14px}
.bad{color:var(--bad);font-size:14px;font-weight:600}
input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
input[type=range]{width:100%}
.res div{padding:8px 0;border-bottom:1px solid var(--bd)}
.res div:last-child{border:0}
.win{color:var(--ac);font-weight:700}
.hide{display:none}
#wrap{position:relative}
#lupa{position:absolute;top:8px;width:55%;max-width:300px;aspect-ratio:1;border:2px solid #ffd400;border-radius:14px;background:#000;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.55)}
</style>
</head>
<body>
<main>
<h1>⚪ Medidor de Bocha</h1>

<div class='card'><div id='msg'></div></div>

<div class='row' style='margin-bottom:10px'>
  <label class='btn pri'>📷 Tirar foto<input id='file' type='file' accept='image/*' capture='environment' hidden></label>
  <button id='refazer'>↺ Refazer tudo</button>
  <button id='undo'>↩ Desfazer último</button>
</div>

<div id='wrap'>
  <canvas id='cv' width='300' height='200'></canvas>
  <canvas id='lupa' class='hide'></canvas>
</div>

<div class='card' style='margin-top:10px'>
  <label class='mut'>Tolerância de cor: <b id='tolv'>45</b> (aumente se o círculo ficar pequeno, diminua se vazar)</label>
  <input id='tol' type='range' min='15' max='120' value='45'>
</div>

<div id='adjBox' class='card hide'>
  <label class='mut'>Tamanho do círculo (ajuste até cobrir o objeto)</label>
  <div class='row' style='flex-wrap:nowrap'>
    <button id='dm' style='flex:0 0 52px;padding:8px'>−</button>
    <input id='sz' type='range' min='10' max='400' value='100'>
    <button id='dp' style='flex:0 0 52px;padding:8px'>+</button>
  </div>
  <div id='info' class='mut' style='margin-top:6px'></div>
  <button id='conf' class='pri' style='margin-top:8px;width:100%'>Confirmar este objeto</button>
  <button id='cancel' style='margin-top:8px;width:100%'>✖ Cancelar este círculo</button>
</div>

<div id='resBox' class='card res hide'></div>
</main>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const lp=$('lupa'),lx=lp.getContext('2d');let photo=null;   // photo = cópia limpa da foto, usada pela lupa
const TOL_PX=1;   // diferença máxima aceita entre os diâmetros das duas bolas (1 pixel)
const BOLA_CM=10.7;   // diâmetro real da bola em cm (usado só para converter o resultado em centímetros)
let base=null,W=0,H=0,mode='m0',objs=[],cur=null;
// objs = [bolim, bola 1, bola 2]

const fm=n=>n.toFixed(1).replace('.',',');   // 1 casa decimal

// Etapas: m0 = bolim, m1 = bola 1, m2 = bola 2, fim = resultado
function setMode(m,keep){
  mode=m;cur=null;if(!keep)objs=[];
  $('resBox').classList.add('hide');$('adjBox').classList.add('hide');
  const M={
    m0:'Fotografe de cima as bolas perto do bolim e toque no <b>bolim</b>.',
    m1:'Toque na <b>primeira bola</b> a medir.',
    m2:'Toque na <b>segunda bola</b> a medir. As duas bolas precisam ter o <b>mesmo diâmetro</b>.',
    fim:'Pronto! Toque em Refazer para uma nova medição.'};
  $('msg').innerHTML=M[m];
  redraw();lupa();
}
$('refazer').onclick=()=>setMode('m0');
$('tol').oninput=e=>{$('tolv').textContent=e.target.value;};
$('sz').oninput=e=>{if(cur){cur.d=+e.target.value;atualizar();}};
// ajuste fino do diâmetro: − e + mudam 1 pixel por toque
function nudge(k){if(cur){cur.d=Math.max(10,cur.d+k);$('sz').value=Math.round(cur.d);atualizar();}}
$('dm').onclick=()=>nudge(-1);$('dp').onclick=()=>nudge(1);
// cancelar o círculo atual (continua na mesma etapa)
$('cancel').onclick=()=>setMode(mode,true);
// desfazer o último objeto confirmado (bolim, bola 1 ou bola 2) e voltar uma etapa
$('undo').onclick=()=>{if(!objs.length)return;objs.pop();setMode(['m0','m1','m2'][objs.length],true);};

$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();
  im.onload=()=>{
    const s=Math.min(1,1000/Math.max(im.width,im.height));
    W=cv.width=Math.round(im.width*s);H=cv.height=Math.round(im.height*s);
    ctx.drawImage(im,0,0,W,H);base=ctx.getImageData(0,0,W,H);
    photo=document.createElement('canvas');photo.width=W;photo.height=H;photo.getContext('2d').putImageData(base,0,0);
    setMode('m0');URL.revokeObjectURL(im.src);
  };
  im.src=URL.createObjectURL(f);e.target.value='';
};

// ---------- cor e detecção ----------
function patch(x,y){
  const d=base.data,v=[[],[],[]];
  for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){
    const xx=Math.min(W-1,Math.max(0,x+i)),yy=Math.min(H-1,Math.max(0,y+j)),k=(yy*W+xx)*4;
    for(let c=0;c<3;c++)v[c].push(d[k+c]);
  }
  return v.map(a=>a.sort((p,q)=>p-q)[24]);
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}

// Espalha a partir do toque pelos pixels de cor parecida; o centro e o diâmetro vêm da caixa que envolve a região
function segment(x,y,col,tol){
  const d=base.data,vis=new Uint8Array(W*H),st=[y*W+x],t2=tol*tol,max=W*H*0.4;
  vis[st[0]]=1;let n=0,x0=x,x1=x,y0=y,y1=y;
  while(st.length){
    const p=st.pop(),k=p*4,r=d[k]-col[0],g=d[k+1]-col[1],b=d[k+2]-col[2];
    if(r*r+g*g+b*b>t2)continue;
    const px=p%W,py=(p/W)|0;n++;
    if(n>max)return null;
    if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
    if(px>0&&!vis[p-1]){vis[p-1]=1;st.push(p-1);}
    if(px<W-1&&!vis[p+1]){vis[p+1]=1;st.push(p+1);}
    if(py>0&&!vis[p-W]){vis[p-W]=1;st.push(p-W);}
    if(py<H-1&&!vis[p+W]){vis[p+W]=1;st.push(p+W);}
  }
  if(n<60)return null;
  return {cx:(x0+x1)/2,cy:(y0+y1)/2,d:(x1-x0+1+y1-y0+1)/2,col};
}

// ---------- desenho ----------
function circle(o,color,label){
  ctx.lineWidth=Math.max(2,W/300);ctx.strokeStyle=color;
  ctx.beginPath();ctx.arc(o.cx,o.cy,o.d/2,0,7);ctx.stroke();
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(o.cx,o.cy,Math.max(3,W/250),0,7);ctx.fill();
  if(label){ctx.font='bold '+Math.round(W/28)+'px sans-serif';ctx.fillText(label,o.cx+o.d/2+4,o.cy-o.d/2);}
}
function redraw(){
  if(!base)return;
  ctx.putImageData(base,0,0);
  if(cur){
    circle(cur,'#ffd400');
    ctx.strokeStyle='#ffd400';ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(cur.cx-cur.d/2,cur.cy);ctx.lineTo(cur.cx+cur.d/2,cur.cy);
    ctx.moveTo(cur.cx,cur.cy-cur.d/2);ctx.lineTo(cur.cx,cur.cy+cur.d/2);ctx.stroke();
  }
  const cols=['#2ecc71','#3498ff','#ff5a36'],names=['Bolim','Bola 1','Bola 2'];
  objs.forEach((o,i)=>circle(o,cols[i],names[i]));
}

// Lupa: mostra a foto bem ampliada ao redor do centro do círculo, para alinhar com precisão
function lupa(){
  if(!cur||!photo||mode==='fim'){lp.classList.add('hide');return;}
  lp.classList.remove('hide');
  const k=Math.min(2,window.devicePixelRatio||1),S=Math.round(lp.getBoundingClientRect().width*k);
  if(lp.width!==S)lp.width=lp.height=S;
  const Z=Math.max(1.2,Math.min(6,0.9*S/cur.d)),h=S/Z;   // Z = pixels da lupa por pixel da foto
  lx.fillStyle='#000';lx.fillRect(0,0,S,S);
  lx.drawImage(photo,cur.cx-h/2,cur.cy-h/2,h,h,0,0,S,S);
  lx.strokeStyle='#ffd400';lx.lineWidth=2*k;
  lx.beginPath();lx.arc(S/2,S/2,cur.d/2*Z,0,7);lx.stroke();
  lx.lineWidth=1;lx.beginPath();
  lx.moveTo(S/2,0);lx.lineTo(S/2,S);lx.moveTo(0,S/2);lx.lineTo(S,S/2);lx.stroke();
  // a lupa fica no canto oposto ao círculo, para não ficar sob o dedo
  const dir=cur.cx/W>0.5;lp.style.left=dir?'8px':'auto';lp.style.right=dir?'auto':'8px';
}

// Redesenha e confere se as duas bolas têm o mesmo diâmetro (só na bola 2)
function atualizar(){
  redraw();lupa();
  let ok=true,t=cur?`Diâmetro deste círculo: ${Math.round(cur.d)} px.`:'';
  if(mode==='m2'&&cur){
    const d1=objs[1].d,dif=Math.abs(cur.d-d1);
    ok=dif<=TOL_PX;
    t=`Bola 1: ${Math.round(d1)} px | Bola 2: ${Math.round(cur.d)} px. `+
      (ok?'Diâmetros iguais ✔':'❌ Diâmetros diferentes: ajuste o círculo (use − e +) até ficarem iguais.');
  }
  $('info').textContent=t;$('info').className=ok?'mut':'bad';$('conf').disabled=!ok;
}

// ---------- toque e arraste ----------
function xy(e){
  const r=cv.getBoundingClientRect();
  return [Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)];
}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  if(!base){$('msg').innerHTML='<b>Tire uma foto primeiro.</b>';return;}
  const [x,y]=xy(e);
  if(cur&&mode!=='fim'&&Math.hypot(x-cur.cx,y-cur.cy)<=cur.d/2*1.3){
    drag={dx:cur.cx-x,dy:cur.cy-y};cv.setPointerCapture(e.pointerId);return;
  }
  tapAt(x,y);
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const [x,y]=xy(e);
  cur.cx=Math.max(0,Math.min(W,x+drag.dx));cur.cy=Math.max(0,Math.min(H,y+drag.dy));
  atualizar();
});
const fimDrag=()=>{drag=null;};
cv.addEventListener('pointerup',fimDrag);cv.addEventListener('pointercancel',fimDrag);

// Toque: detecta o objeto (na bola 2 usa a cor da bola 1) e mostra o círculo para ajuste
function tapAt(x,y){
  if(mode==='fim')return;
  const tol=+$('tol').value,pc=patch(x,y);
  const ref=mode==='m2'?objs[1].col:null;
  const col=ref&&dist(ref,pc)<tol*1.5?ref:pc;
  cur=segment(x,y,col,tol)||{cx:x,cy:y,d:Math.round(mode==='m2'?objs[1].d:W/6),col:pc};
  $('sz').max=Math.round(Math.min(W,H)*0.6);$('sz').value=Math.round(cur.d);
  $('adjBox').classList.remove('hide');
  const nome={m0:'do bolim',m1:'da bola 1',m2:'da bola 2'}[mode];
  $('msg').innerHTML=`Arraste o círculo até o <b>centro</b> ${nome}, ajuste o tamanho e toque em <b>Confirmar</b>.`;
  atualizar();
}

// ---------- confirmar e calcular ----------
$('conf').onclick=()=>{
  if(!cur)return;
  if(mode==='m2'){
    const b1=objs[1];
    if(Math.abs(cur.d-b1.d)>TOL_PX)return;
    const m=(cur.d+b1.d)/2;cur.d=m;b1.d=m;   // as duas bolas ficam com o mesmo diâmetro
  }
  objs.push(cur);
  const nx={m0:'m1',m1:'m2'}[mode];
  if(nx)setMode(nx,true);else{setMode('fim',true);calcular();}
};

function calcular(){
  const [b,a1,a2]=objs;
  const s=BOLA_CM/a1.d;   // cm por pixel, pelo diâmetro (igual) das bolas
  const out=[a1,a2].map((o,i)=>{
    const cpx=Math.hypot(o.cx-b.cx,o.cy-b.cy);
    return {n:i+1,o,centro:cpx*s};
  });
  out.forEach(r=>{
    ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,W/300);
    ctx.beginPath();ctx.moveTo(b.cx,b.cy);ctx.lineTo(r.o.cx,r.o.cy);ctx.stroke();
    const mx=(b.cx+r.o.cx)/2,my=(b.cy+r.o.cy)/2,t=fm(r.centro)+' cm';
    ctx.font='bold '+Math.round(W/26)+'px sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(t,mx,my);
    ctx.fillStyle='#fff';ctx.fillText(t,mx,my);
  });
  const best=out.reduce((a,c)=>c.centro<a.centro?c:a);
  const diff=Math.abs(out[0].centro-out[1].centro);
  let h='';
  out.forEach(r=>{
    const ini=r===best?`<span class='win'>🏆 `:'<span>';
    h+=`<div>${ini}Bola ${r.n}</span>: <b>${fm(r.centro)} cm</b> do centro do bolim ao centro da bola</div>`;
  });
  const nota=diff<1?` — diferença muito pequena (${fm(diff)} cm), confira com a trena.`:` (por ${fm(diff)} cm)`;
  h+=`<div><b>Mais perto: bola ${best.n}</b>${nota}</div>`;
  h+=`<div class='mut'>Escala: bola de ${fm(BOLA_CM)} cm = ${Math.round(a1.d)} px nesta foto.</div>`;
  $('resBox').innerHTML=h;$('resBox').classList.remove('hide');
}

setMode('m0');
</script>
</body>
</html>
